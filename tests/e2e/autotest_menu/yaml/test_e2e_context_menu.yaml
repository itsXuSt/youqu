name: "E2E: 右键菜单查找并输入关键词"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "右键点击终端中心并选择查找"
    action: context_menu_comb
    x: 989
    y: 591
    items: ["查找"]
    wait: 1.0

  - name: "在查找输入框中输入uos"
    action: keyboard_type
    text: "uos"
    wait: 0.3

  - name: "按回车键执行查找"
    action: keyboard_press
    keys: "Return"
    wait: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "deepin-terminal"

teardown:
  - action: session_stop
