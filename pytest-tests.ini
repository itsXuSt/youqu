[pytest]
testpaths = tests
addopts = -s -vv --tb=short --import-mode=importlib --confcutdir=tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    e2e: end-to-end test (requires external services, VLM API, desktop or browser runtime)
    slow: test that takes significant time

